<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claire OS</title>

  <style>
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;
      background:#f5f5f7;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      width:340px;
      background:white;

    h1{
      margin:0;
      font-size:34px;
    }

    p{
      color:#666;
      margin-top:10px;
    }

    button{
      margin-top:25px;
      width:100%;
      height:52px;
      border:none;
      border-radius:16px;
      background:black;
      color:white;
      font-size:18px;
    }
  </style>
</head>

<body>

<div class="card">

<h1>🍎 Claire OS</h1>

<p>欢迎回来，Lin</p>

<button>
开始记账

</html>
