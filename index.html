<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Claire OS</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="card">

<h1>🍎 Claire OS</h1>

<div class="summary">

    <div class="summary-card">
        <div class="label">💰 今日消费</div>
        <div class="value" id="total">¥0.00</div>
    </div>

  <div class="summary-card">
    <div class="label">📅 本月消费</div>
    <div class="value" id="monthTotal">¥0.00</div>
</div>

</div>

<input
id="amount"
type="number"
placeholder="金额">

<select id="category">

<option>☕ 咖啡</option>

<option>🍜 餐饮</option>

<option>🚗 交通</option>

<option>👕 购物</option>

<option>🏋️ 健身</option>

<option>📚 学习</option>

<option>🎁 其它</option>

</select>

<input
id="note"
placeholder="备注">

<button onclick="saveExpense()">
保存消费
</button>

<div id="list"></div>

</div>

<script src="script.js"></script>

</body>
</html>
